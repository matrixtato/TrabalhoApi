<!DOCTYPE html>
    <html lang="pt-br">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Busca Pokémon</title>
        </head>
        <body>
            <div>
                <form id="meuForm">
                    <label for="personagens">Nome do Pokémon:</label>
                    <input type="text" id="personagens" name="personagens" placeholder="Ex: Pikachu">
                    <button type="submit">Buscar</button>
                    <h3>Nome: <span id="Nomepkn"></span></h3>
                    <img src="../assest/pokebola.png" alt="Pokemon" id="imagempkn" style="width: 150px; height: 150px;">
                    <h3>Tipo: <span id="Tipopkn"></span></h3>
                    <h3>HP: <span id="HPpkn"></span></h3>
                    <h3>ATK: <span id="ATKpkn"></span></h3>
                    <h3>DEF: <span id="DEFpkn"></span></h3>
                    <h3>SPD: <span id="SPDpkn"></span></h3>
                </form>
                <script src="script.js"></script>
            </div>
        </body>
</html>
